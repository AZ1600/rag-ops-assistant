name: Deploy to AWS ECS

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ecs
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: rag-ops-assistant
  ECS_CLUSTER: rag-ops-assistant-cluster
  ECS_SERVICE: rag-ops-assistant-service
  ECS_TASK_FAMILY: rag-ops-assistant
  ECS_CONTAINER_NAME: rag-ops-assistant
  TARGET_GROUP_NAME: rag-ops-assistant-tg

jobs:
  preflight:
    name: Check deployment changes
    runs-on: ubuntu-latest

    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')

    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      deploy: ${{ steps.changes.outputs.deploy }}

    steps:
      - name: Resolve deployment SHA
        id: sha
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 2

      - name: Check for deployment-relevant changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual deployment requested."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA="${{ steps.sha.outputs.sha }}"

          echo "Files changed in ${SHA}:"
          git diff --name-only "${SHA}^1" "$SHA" | tee /tmp/changed-files.txt

          if grep -Eq \
            '^(src/|data/|Dockerfile$|requirements\.txt$|requirements-dev\.txt$|\.dockerignore$)' \
            /tmp/changed-files.txt; then

            echo "Application-related changes detected."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No application-related changes detected."
            echo "ECS deployment will be skipped."
            echo "deploy=false" >> "$GITHUB_OUTPUT"

            {
              echo "### ECS deployment skipped"
              echo
              echo "No application or container-related files changed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Build and deploy
    needs: preflight

    if: needs.preflight.outputs.deploy == 'true'

    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: rag-ops-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ARM64 image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.preflight.outputs.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            --pull \
            --provenance=false \
            -t "$IMAGE_URI" \
            .

          docker push "$IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      - name: Render new image into task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify ALB target health
        shell: bash
        run: |
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names "$TARGET_GROUP_NAME" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)

          echo "Waiting for a healthy ALB target..."

          for attempt in {1..20}; do
            HEALTHY=$(aws elbv2 describe-target-health \
              --target-group-arn "$TG_ARN" \
              --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" \
              --output text)

            if [[ "$HEALTHY" -ge 1 ]]; then
              echo "ALB target is healthy."
              exit 0
            fi

            echo "Attempt ${attempt}/20: no healthy target yet."
            sleep 15
          done

          echo "Target health verification failed."

          aws elbv2 describe-target-health \
            --target-group-arn "$TG_ARN"

          exit 1